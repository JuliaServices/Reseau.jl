name: Windows Resolver Restart Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolver:
    runs-on: windows-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1.13']
        arch: [x86, x64]
    env:
      JULIA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - name: Exercise standalone foreign thread teardown
        run: julia --startup-file=no test/foreign_thread_exit_probe.jl
