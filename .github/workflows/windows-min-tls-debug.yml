name: Windows Resolver Restart Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolver:
    runs-on: windows-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        version: ['1.13']
        arch: [x86]
        guard: ['false', 'true']
    env:
      JULIA_NUM_THREADS: '1'
      PROBE_PROFILE_GUARD: ${{ matrix.guard }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - name: Exercise standalone foreign thread teardown
        shell: pwsh
        run: |
          $debuggers = Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Filter cdb.exe -Recurse -ErrorAction SilentlyContinue
          $debuggers | Select-Object -ExpandProperty FullName
          $cdb = $debuggers | Where-Object { $_.Directory.Name -eq 'x86' } | Select-Object -First 1
          $probe = Start-Process julia -ArgumentList '--startup-file=no','test/foreign_thread_exception_probe.jl' -PassThru -RedirectStandardOutput probe.stdout -RedirectStandardError probe.stderr
          $finished = $probe.WaitForExit(90000)
          Get-Content probe.stdout
          Get-Content probe.stderr
          if (-not $finished) {
            if ($cdb) { & $cdb.FullName -p $probe.Id -c '~* kb; .detach; q' }
            Stop-Process -Id $probe.Id -Force
            throw 'Probe timed out'
          }
          if ($probe.ExitCode -ne 0) { throw "Probe failed: $($probe.ExitCode)" }

