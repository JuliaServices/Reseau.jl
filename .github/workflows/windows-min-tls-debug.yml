name: Windows Resolver Restart Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolver:
    runs-on: windows-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.13']
    env:
      JULIA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: x86
      - uses: julia-actions/cache@v2
      - name: Exercise fresh resolver worker generations
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.instantiate(); include("test/resolver_restart_probe.jl")'
