name: Windows Native Thread Runtime Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Julia 1.13.1 - windows-latest - ${{ matrix.arch }} - ${{ matrix.mode }}
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            mode: exception
          - arch: x86
            mode: no-exception
          - arch: x64
            mode: exception
    env:
      JULIA_NUM_THREADS: 1
      JULIA_PKG_PRECOMPILE_AUTO: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: diagnostic
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.1'
          arch: ${{ matrix.arch }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Compile native thread trampoline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force capture | Out-Null
          Copy-Item diagnostic/.github/scripts/windows-runtime-threads.* capture
          cl /nologo /LD /O2 /W4 /WX diagnostic/.github/scripts/windows-runtime-threads.c /link /out:capture/runtime-threads.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dumpbin /exports capture/runtime-threads.dll | Set-Content capture/native-exports.txt
      - name: Run runtime-only control with bounded native capture
        shell: pwsh
        run: >-
          & diagnostic/.github/scripts/windows-runtime-threads.ps1
          -Driver (Resolve-Path diagnostic/.github/scripts/windows-runtime-threads.jl).Path
          -Library (Resolve-Path capture/runtime-threads.dll).Path
          -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'capture')
          -Architecture '${{ matrix.arch }}'
          -Mode '${{ matrix.mode }}'
      - name: Upload native capture and exact source metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-julia-1.13.1-${{ matrix.arch }}-${{ matrix.mode }}
          path: capture
          if-no-files-found: error
          retention-days: 7
