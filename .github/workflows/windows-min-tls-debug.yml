name: Windows Resolver Restart Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolver:
    runs-on: windows-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.13'
            arch: x86
            disable_gc: 'false'
          - version: '1.13'
            arch: x86
            disable_gc: 'true'
          - version: '1.13'
            arch: x64
            disable_gc: 'false'
    env:
      JULIA_NUM_THREADS: '1'
      PROBE_DISABLE_GC: ${{ matrix.disable_gc }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - name: Exercise fresh resolver worker generations
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.instantiate(); include("test/resolver_restart_probe.jl")'
