name: Issue 136 diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.6"
          arch: x64
      - name: Run diagnostic harness
        shell: powershell
        run: |
          .\diagnostics\issue136\run.ps1 -TimeoutSeconds 180 -Threads 1
      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reseau-issue-136-windows
          path: reseau-issue-136-*.zip
          if-no-files-found: warn
      - name: Verify hosted runner completed
        shell: powershell
        run: |
          $run = Get-ChildItem -Directory -Filter "reseau-issue-136-*" |
            Sort-Object LastWriteTime |
            Select-Object -Last 1
          if ($null -eq $run) {
            throw "The diagnostic harness did not create an output directory."
          }
          $stdout = Get-Content -LiteralPath (Join-Path $run.FullName "stdout.log") -Raw
          if ($stdout -notmatch "RESEAU_136_REPRO_DONE") {
            throw "The hosted Windows reproducer did not complete successfully."
          }
