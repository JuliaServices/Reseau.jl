name: Windows precompile issue replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    name: Julia 1.12.6 Windows x64 - ${{ matrix.label }} - t${{ matrix.threads }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        threads: [1, 2]
        label: [release-1.5.0, current-main]
        include:
          - label: release-1.5.0
            revision: 5769fdd78afc918bd4892388b90961c28a71f1b7
          - label: current-main
            revision: 50ca2655561fff36f2dca6c5987b110e3d829c7b
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      JULIA_PKG_PRECOMPILE_AUTO: '1'
      RESEAU_PRECOMPILE_ONLY: ''
      RESEAU_RUN_TLS_TESTS: '1'
      RESEAU_RUN_NETWORK_TESTS: '1'
      RESEAU_TRIM_EXE_TIMEOUT_S: '60.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
          arch: x64
      - name: Reproduce fresh-depot installation, strict precompile and full tests
        env:
          JULIA_DEPOT_PATH: ${{ runner.temp }}/reseau136-depot
        shell: julia --color=yes --startup-file=no --history-file=no {0}
        run: |
          using Pkg, UUIDs
          @assert Sys.iswindows() && Sys.WORD_SIZE == 64
          @assert VERSION == v"1.12.6"
          @assert Threads.nthreads() == ${{ matrix.threads }}
          println("Requested source: ${{ matrix.revision }}")
          Pkg.activate(temp=true)
          Pkg.add(PackageSpec(url="https://github.com/JuliaServices/Reseau.jl", rev="${{ matrix.revision }}"))
          Pkg.precompile(; strict=true)
          using Reseau
          info = Pkg.dependencies()[UUID("802f3686-a58f-41ce-bb0c-3c43c75bba36")]
          @show info
          Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)
          println("FRESH_PRECOMPILE_COMPLETE")
          Pkg.test("Reseau"; coverage=false)
          println("FULL_SUITE_COMPLETE")
