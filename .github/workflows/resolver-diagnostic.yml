name: Resolver shutdown diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Julia ${{ matrix.version }} - Windows x86 resolver lifecycle
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10.12', '1.12.6', '1.13.1']
    env:
      JULIA_NUM_THREADS: '1'
      RESEAU_RUN_TLS_TESTS: '1'
      RESEAU_RUN_NETWORK_TESTS: '1'
      RESEAU_RUN_TRIM_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: x86
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
